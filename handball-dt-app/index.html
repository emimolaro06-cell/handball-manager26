<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Handball DT</title>
<meta name="theme-color" content="#0E1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handball DT">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0E1419;--panel:#121A22;--panel2:#17212B;--panel3:#1A2430;--line:#243140;--text:#E8EDF2;--muted:#8E9BA8;--accent:#FF8A3D;--green:#3DD68C;--red:#FF6B6B;--gold:#F5C451;--court:#1F4E8C;--court2:#2B5E9E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo,.me-n,.obj,.rival-n,.sb-score,.sb-n,.ph-n,.ph-med,.ph-num,.sys,.tok-c,.continue,.pts,.d-pos{font-family:"Barlow Condensed","Arial Narrow",Inter,sans-serif;letter-spacing:.01em}
h1{font-size:34px;line-height:1;margin:4px 0 0;font-weight:700}
h2{font-size:26px;margin:24px 0 12px}h3{font-size:20px;margin:0 0 12px}
button{font-family:inherit;font-size:14px;color:inherit;cursor:pointer}
p{margin:8px 0}
.muted{color:var(--muted)}.sm{font-size:12.5px}.dim{opacity:.22}.ok{color:var(--green)}.bad{color:var(--red)}.warn{color:var(--gold)}.nowrap{white-space:nowrap}.center{text-align:center;justify-content:center}
.kicker{display:block;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}.wrap{flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:16px 0}

/* ---- marco ---- */
.shell{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.me{display:flex;gap:12px;align-items:center;padding:0 4px 18px;border-bottom:1px solid var(--line);margin-bottom:8px}
.me-t{display:flex;flex-direction:column;min-width:0}.me-n{font-size:20px;font-weight:700;line-height:1.05}
.grp{font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:14px 10px 6px}
.nav{text-align:left;min-height:38px;padding:0 12px;border-radius:9px;border:none;background:transparent;font-weight:500;color:#C9D2DB}
.nav:hover{background:var(--panel2);color:var(--text)}.nav.on{background:var(--panel3);color:var(--text);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.side-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.continue{background:var(--accent);color:#1A0E05;border:none;border-radius:12px;min-height:54px;font-size:21px;font-weight:700}
.continue:hover{filter:brightness(1.08)}
.side-foot .link{text-align:center}
.area{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:24px 32px 18px;border-bottom:1px solid var(--line)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px}
.main{padding:24px 32px 60px;max-width:1320px;width:100%}

/* ---- tarjetas y botones ---- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.tight{padding:14px}.card.flush{padding:0;overflow:hidden}.card-h{padding:14px 16px 8px}
.pad{padding:16px}
.badge{display:inline-flex;align-items:center;justify-content:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;flex:0 0 auto;vertical-align:middle}
.btn{background:var(--accent);color:#1A0E05;border:none;border-radius:10px;padding:0 18px;min-height:42px;font-weight:700}
.btn:hover{filter:brightness(1.08)}.btn.big{min-height:48px;font-size:15px;padding:0 22px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}.btn.ghost:hover{border-color:var(--accent)}
.btn.full{width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btns.center{justify-content:center;margin:16px 0}
.link{background:none;border:none;color:var(--accent);padding:6px 0;font-weight:600}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:34px;font-weight:600;font-size:13px;color:#C9D2DB}
.chip:hover{border-color:#3A4B5E}.chip.on{background:var(--accent);border-color:var(--accent);color:#1A0E05}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fm{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-left:3px}
.fm-G{background:rgba(61,214,140,.18);color:var(--green)}.fm-E{background:rgba(245,196,81,.18);color:var(--gold)}.fm-P{background:rgba(255,107,107,.18);color:var(--red)}
.med{display:inline-block;min-width:34px;text-align:center;font-weight:700;color:var(--accent)}.med.warn{color:var(--gold)}
.tag{font-size:10px;letter-spacing:.06em;font-weight:700;color:var(--accent);border:1px solid rgba(255,138,61,.4);border-radius:5px;padding:1px 5px}

/* ---- tablas ---- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.tbl th{font-size:11px;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{text-align:center;padding:8px 6px;border-bottom:1px solid #1B2632}
.tbl .tl{text-align:left}.tbl tr:last-child td{border-bottom:none}
.tbl.big td{padding:11px 8px}.tbl.big th{padding:10px 8px}
.tbl td.num{color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;width:36px}
.tbl tr.mine td{background:rgba(255,138,61,.09)}.tbl tr.mine td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--panel2)}.tbl tr.sel td{background:var(--panel3)}
.tbl tr.next td{background:rgba(255,138,61,.07)}
.tbl tr.detail td{background:#0F161D;text-align:left;padding:10px 16px}
.tbl tr.z-champ td:first-child{box-shadow:inset 3px 0 0 var(--gold)}.tbl tr.z-up td:first-child{box-shadow:inset 3px 0 0 var(--green)}.tbl tr.z-down td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.pts{font-size:18px;font-weight:700}
.scroll{overflow-x:auto}
.legend{display:flex;gap:18px;flex-wrap:wrap;padding:12px 16px;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.z-champ{background:var(--gold)}.legend i.z-up{background:var(--green)}.legend i.z-down{background:var(--red)}
.pn{display:flex;gap:8px;align-items:center}
.sl{display:grid;grid-template-columns:1fr 64px 1fr;gap:8px;padding:6px 0;font-size:13px;border-bottom:1px solid #1B2632}
.sl:last-child{border-bottom:none}.sl-s{text-align:center;font-weight:700}.sl-t.r{text-align:right}

/* ---- inicio ---- */
.dash{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:16px;align-items:start}
.dash .hero{grid-row:span 2}
.dash .span2{grid-column:span 2}
.hero{background:linear-gradient(165deg,#1C2834 0%,#121A22 70%)}
.rival{display:flex;gap:16px;align-items:center;margin:16px 0}
.rival-n{font-size:30px;font-weight:700;line-height:1}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.facts>div{background:var(--panel3);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.facts b{font-size:14px}
.obj{font-size:24px;font-weight:700;line-height:1.1;margin-top:6px}
.res{display:grid;grid-template-columns:auto 30px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1B2632;font-size:13px}
.res .fm{margin:0}

/* ---- tácticas ---- */
.tactics{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.t-head p{margin:0}
.toggle{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.toggle button{border:none;background:transparent;border-radius:999px;min-height:34px;padding:0 18px;font-weight:600;color:var(--muted)}
.toggle button.on{background:var(--accent);color:#1A0E05}
.t-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.t-controls .kicker{margin-right:2px}
.vsep{width:1px;height:26px;background:var(--line);margin:0 8px}
.sys{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:38px;padding:0 14px;font-size:20px;font-weight:700;color:#C9D2DB}
.sys.on{border-color:var(--accent);color:var(--accent);background:rgba(255,138,61,.1)}
.t-court-row{display:grid;grid-template-columns:minmax(0,560px) minmax(250px,1fr);gap:16px;align-items:start}
.court{position:relative;width:100%;aspect-ratio:1/1;background:var(--court);border-radius:16px;box-shadow:inset 0 0 0 10px var(--court2);overflow:hidden}
.court-svg{position:absolute;inset:0;width:100%;height:100%}
.court-note{position:absolute;right:16px;bottom:14px;font-size:11px;letter-spacing:.1em;font-weight:700;color:rgba(255,255,255,.55)}
.tok{position:absolute;transform:translate(-50%,-50%);width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:0;transition:left .35s ease,top .35s ease}
.tok-c{width:48px;height:48px;border-radius:50%;background:#fff;color:#0E1419;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;box-shadow:0 0 0 3px rgba(14,20,25,.55),0 4px 10px rgba(0,0,0,.35)}
.tok.gk .tok-c{background:var(--gold)}
.tok.on .tok-c{box-shadow:0 0 0 3px var(--accent),0 0 0 7px rgba(255,138,61,.3),0 4px 10px rgba(0,0,0,.35)}
.tok-n{background:#0E1419;color:var(--text);font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok:hover .tok-c{transform:scale(1.06)}
.warn-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);vertical-align:1px}
.t-side{display:flex;flex-direction:column;gap:12px}
.t-side p{font-size:13px;line-height:1.5;margin:8px 0 0}
.bench{display:flex;flex-direction:column;margin-top:8px;max-height:330px;overflow:auto}
.bench-r,.cand{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:8px;align-items:center;background:none;border:none;border-bottom:1px solid #1B2632;padding:7px 4px;text-align:left;border-radius:6px}
.cand{grid-template-columns:34px minmax(0,1fr) auto}
.bench-r:hover,.cand:hover{background:var(--panel2)}.bench-r.on{background:var(--panel3);box-shadow:inset 3px 0 0 var(--accent)}
.num-c{width:28px;height:28px;border-radius:50%;background:var(--panel3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#C9D2DB}
.bn{font-size:13px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-panel{position:sticky;top:16px}
.ph{display:flex;gap:14px;align-items:center}
.ph-num{width:64px;height:64px;flex:0 0 64px;border-radius:50%;background:var(--accent);color:#1A0E05;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.ph-t{display:flex;flex-direction:column;min-width:0;flex:1}.ph-n{font-size:23px;font-weight:700;line-height:1.05}
.ph-t .muted{font-size:12.5px}
.ph-m{display:flex;flex-direction:column;align-items:flex-end}.ph-med{font-size:34px;font-weight:700;color:var(--accent);line-height:1}
.attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:18px 0 10px}
.bar{height:5px;background:#223040;border-radius:3px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:3px}
.h-sub{font-weight:700;font-size:14px}
.cands{display:flex;flex-direction:column;margin:8px 0}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--panel3);border-radius:10px;padding:10px 12px;margin-top:10px}
.note p{margin:0;font-size:13px}.note-i{width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:var(--gold);color:#1A0E05;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px}

/* ---- plantel ---- */
.squad{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.sq-main>.row-between p{margin:0 0 14px}
.sq-side{display:flex;flex-direction:column;gap:16px;position:sticky;top:16px}
.depth{display:grid;grid-template-columns:30px 46px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #1B2632}
.d-pos{font-size:16px;font-weight:700}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:#2B3A4A}.dots i.on{background:var(--accent)}

/* ---- partido ---- */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;background:linear-gradient(165deg,#1C2834,#121A22);padding:26px}
.sb-team{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sb-n{font-size:22px;font-weight:700}
.sb-mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.sb-score{font-size:72px;font-weight:700;line-height:.9}
.mvp{text-align:center;margin-top:12px;color:var(--muted)}.mvp b{color:var(--gold)}
.match-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.match-grid aside{display:flex;flex-direction:column;gap:16px}
.feed{max-height:620px;overflow:auto;margin-top:8px}
.feed-r{display:grid;grid-template-columns:38px 78px 1fr auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid #1B2632;font-size:13.5px}
.feed-r.mine{background:rgba(255,138,61,.05)}
.f-min{color:var(--muted);font-weight:600}
.f-tag{font-size:10.5px;letter-spacing:.08em;font-weight:700;border-radius:5px;padding:3px 0;text-align:center}
.f-tag.goal{background:rgba(255,138,61,.16);color:var(--accent)}.f-tag.save{background:rgba(245,196,81,.15);color:var(--gold)}
.f-s{font-weight:700}
.st-head{display:grid;grid-template-columns:50px 1fr 50px;text-align:center;font-weight:700;margin-bottom:6px}
.st-r{display:grid;grid-template-columns:50px 1fr 50px;text-align:center;padding:7px 0;border-bottom:1px solid #1B2632;font-size:13px}

/* ---- tabla / stats / cierre ---- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.two.tight{gap:10px;margin-top:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.plain{list-style:none;padding:0;margin:6px 0}.plain li{padding:5px 0;display:flex;gap:8px;align-items:center}.plain li.mine{color:var(--accent);font-weight:700}
.end-hero{display:flex;flex-direction:column;align-items:center;gap:6px;padding:32px}
.trophy{font-size:54px}.big-note{font-size:17px;font-weight:600}

/* ---- inicio de partida ---- */
.start{max-width:1000px;margin:0 auto;padding:44px 24px 60px}
.logo{font-size:48px;font-weight:700;letter-spacing:.04em}.logo b{color:var(--accent)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}
.country{margin-bottom:18px}.country .kicker{margin-bottom:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lgcard{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.lgcard:hover,.clubrow:hover{border-color:var(--accent)}
.lgcard b{font-size:20px;font-family:"Barlow Condensed",sans-serif}.lg-div{font-size:11px;letter-spacing:.08em;color:var(--accent);font-weight:700}
.clublist{display:flex;flex-direction:column;gap:8px}
.clubrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.cn{display:flex;flex-direction:column}.st{color:var(--gold);letter-spacing:2px}

/* ---- modal ---- */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,12,.7);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{max-width:420px;width:100%}

/* ---- responsive ---- */
@media (max-width:1180px){
  .dash{grid-template-columns:1fr 1fr}.dash .hero{grid-row:auto;grid-column:span 2}
  .tactics{grid-template-columns:1fr}.t-panel{position:static}
  .squad{grid-template-columns:1fr}.sq-side{position:static}
}
@media (max-width:860px){
  .shell{flex-direction:column}
  .side{position:sticky;top:0;z-index:20;width:100%;height:auto;flex:none;flex-direction:row;align-items:center;gap:6px;overflow-x:auto;padding:10px 12px;border-right:none;border-bottom:1px solid var(--line)}
  .me{border:none;padding:0 8px 0 0;margin:0}.me-t{display:none}
  .grp{display:none}.nav{white-space:nowrap;min-height:36px;flex:0 0 auto}
  .side-foot{margin:0;padding:0;flex-direction:row}.side-foot .link{display:none}
  .continue{min-height:40px;font-size:16px;padding:0 14px;white-space:nowrap;border-radius:10px}
  .top{padding:16px}.main{padding:16px 14px 40px}h1{font-size:28px}
  .dash,.two,.three,.match-grid{grid-template-columns:1fr}.dash .hero,.dash .span2{grid-column:auto}
  .t-court-row{grid-template-columns:1fr}
  .tok{width:60px}.tok-c{width:38px;height:38px;font-size:16px}.tok-n{font-size:10px;padding:1px 5px;max-width:70px}
  .sb-score{font-size:48px}.sb-n{font-size:16px}.scoreboard{padding:16px;gap:8px}
  .feed-r{grid-template-columns:30px 66px 1fr auto;gap:6px;font-size:12.5px}
  .clubrow{grid-template-columns:auto 1fr}.clubrow .st,.clubrow>.sm{display:none}
  .tbl.big td,.tbl.big th{padding:8px 5px}
}

/* ===== Sesión 2 ===== */
.txt{color:var(--text)}
.crest{flex:0 0 auto;vertical-align:middle;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.tbl td.tl .crest{margin-right:6px}
.count{margin-left:8px;background:var(--accent);color:#1A0E05;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.nav{display:flex;align-items:center}
.continue{display:flex;align-items:center;justify-content:center;gap:8px}
.continue.match{background:var(--green);color:#06210F}
.side-foot .link{font-size:12.5px}
.dim-link{color:var(--muted)!important;margin-top:6px}
/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
.wd{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.wd-d{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wd-i{font-size:16px;line-height:1;color:var(--muted)}.wd-k{font-size:12px;font-weight:600}
.wd.train .wd-i{color:var(--accent)}.wd.press .wd-i{color:var(--gold)}.wd.match .wd-i{color:var(--green)}
.wd.match{border-color:rgba(61,214,140,.4)}
.wd.today{box-shadow:0 0 0 2px var(--accent);background:var(--panel3)}.wd.past{opacity:.45}
.alert{display:flex;align-items:center;gap:12px;background:rgba(245,196,81,.1);border:1px solid rgba(245,196,81,.35);border-radius:12px;padding:10px 14px;margin:16px 0}
.alert span:nth-child(2){flex:1;font-weight:600}
.sm-btn{min-height:34px;padding:0 14px}
.dash{margin-top:16px}
.mini-inbox{display:flex;flex-direction:column;margin-top:6px}

.flash{animation:flash 2.6s infinite}.flash:nth-of-type(2n){animation-delay:1.1s}.flash:nth-of-type(3n){animation-delay:.5s}

/* día de partido */

/* arrastre */
.tok,.bench-r{touch-action:none;user-select:none;-webkit-user-select:none}

.tok.dragging{opacity:.35}

.topt.on{border-color:var(--accent);background:rgba(255,138,61,.1)}

/* ===== Estilo v4: paneles tipo FM sobre fondo animado ===== */
html,body{background:#0A1015}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(120% 90% at 50% 0%,#132131 0%,#0A1015 60%)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38;will-change:transform}
.bgfx .b1{width:46vw;height:46vw;left:-10vw;top:-12vw;background:#FF8A3D;opacity:.16;animation:drift1 38s ease-in-out infinite alternate}
.bgfx .b2{width:52vw;height:52vw;right:-14vw;top:18vh;background:#1F5FAF;opacity:.3;animation:drift2 46s ease-in-out infinite alternate}
.bgfx .b3{width:38vw;height:38vw;left:28vw;bottom:-22vw;background:#14866D;opacity:.18;animation:drift3 52s ease-in-out infinite alternate}
.bgfx .lines{position:absolute;inset:-10%;width:120%;height:120%;opacity:.045;animation:lines 90s linear infinite alternate}
@keyframes drift1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vw,-10vh) scale(.9)}}
@keyframes drift3{to{transform:translate(12vw,-16vh) scale(1.2)}}
@keyframes lines{from{transform:translate(-3%,-2%) rotate(-2deg)}to{transform:translate(3%,2%) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.bgfx i,.bgfx .lines{animation:none}}

.conf-bar{position:relative;height:8px;background:rgba(255,255,255,.08);border-radius:4px;margin:8px 0 4px}.conf-bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.conf-bar span{position:absolute;top:-3px;width:2px;height:14px;background:rgba(255,255,255,.35)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin:10px 0}
.job{display:flex;align-items:center;gap:12px;padding:12px;border-radius:6px;background:rgba(255,255,255,.04)}
.job-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.job-t b{font-size:15px}.job .btn{min-height:36px;padding:0 14px}
.stars-s{color:var(--gold);letter-spacing:1px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0 8px}
@media (max-width:760px){.slots{grid-template-columns:1fr}}
.slot{display:flex;align-items:center;gap:12px;min-height:96px;text-align:left}
.slot-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.slot-t b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-b{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.slot-b .btn{min-height:34px;padding:0 14px}
.slot.empty{flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;color:var(--text);border:1px dashed rgba(255,255,255,.14)!important;width:100%}
.slot.empty b{color:var(--accent);font-size:16px}.slot.empty:hover,.slot.empty.on{border-color:var(--accent)!important}
.imp{margin:4px 0 0}.imp label{display:inline-flex;align-items:center;cursor:pointer;min-height:36px}
.slots-mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.slot-m{padding:10px;border-radius:6px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;gap:2px;min-width:0}.slot-m b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-m.on{box-shadow:inset 0 0 0 1px var(--accent)}
.link.bad{color:var(--red)}
/* copas */
.cup-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}.cup-top .sel{max-width:340px;margin-left:auto}
.mchip.cup .mc-lg{background:rgba(245,196,81,.18);color:var(--gold)}
.tie.bye{opacity:.75}
/* defensa: puestos y roles */
.tok-r{font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:4px;background:rgba(14,20,25,.85);color:var(--muted)}
.tok-r.r-ant{background:rgba(255,138,61,.9);color:#1A0E05}.tok-r.r-blo{background:rgba(59,130,246,.9);color:#fff}
.droles{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.drole{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--text)}
.drole.on{border-color:var(--accent);background:rgba(255,138,61,.1)}
/* cuerpo técnico y vestuario */
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.staff-h{display:flex;align-items:center;gap:12px;margin:8px 0}.staff-h svg{width:52px;height:52px;flex:none}.staff-h>div{display:flex;flex-direction:column;gap:2px}
.cand-s{align-items:center;gap:8px}.cand-s>span:first-child{flex:1;min-width:0}
.pmbar{display:inline-block;width:70px;height:6px;border-radius:3px;background:rgba(255,255,255,.08);vertical-align:middle;overflow:hidden}.pmbar i{display:block;height:100%}
.talk,.talk-res{margin:12px 0}.talk .filters{margin:6px 0}
.ht-talk{display:flex;flex-wrap:wrap;align-items:center;gap:6px;width:100%;margin-bottom:8px}.talk-ht{color:var(--text)}
/* noticias y premios */
.news-r{display:grid;grid-template-columns:auto auto 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05)}
.news-k{font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:4px;background:rgba(255,255,255,.08);color:var(--muted)}
.news-k.k-pase{background:rgba(61,214,140,.15);color:var(--green)}.news-k.k-dt{background:rgba(255,107,107,.15);color:var(--red)}.news-k.k-ideal{background:rgba(255,138,61,.15);color:var(--accent)}.news-k.k-premio{background:rgba(245,196,81,.18);color:var(--gold)}
.news-c{display:flex;gap:4px}.news-t{font-size:13.5px;line-height:1.4}
@media (max-width:700px){.news-r{grid-template-columns:auto 1fr}.news-c{display:none}.news-r .nowrap{grid-column:2}}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:14px 0;text-align:left}
.aw{padding:10px 12px;border-radius:6px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;gap:2px}.aw.mine{box-shadow:inset 0 0 0 1px var(--accent)}
/* perfil del entrenador */
.coach-setup{display:flex;flex-direction:column;gap:14px;max-width:980px}
.cs-row{display:grid;grid-template-columns:2fr 1.4fr .7fr;gap:12px;margin-top:10px}.cs-row label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.cs-row .sel{width:100%;min-height:40px;font-size:14px;color:var(--text)}
@media (max-width:700px){.cs-row{grid-template-columns:1fr}}
.cs-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:10px}
.topt.on{box-shadow:inset 0 0 0 1px var(--accent);background:rgba(255,138,61,.1)}
.coach-h{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.coach-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#c9551a);color:#1A0E05;font:700 24px "Barlow Condensed",sans-serif;flex:none}
.replog{margin-top:8px}
.cs-row input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.cup-top select{width:auto}
/* cambios ataque-defensa */
.tok.swd::after{content:"⇄";position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#3b82f6;color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700}
.toggle.sm-t{display:inline-flex;vertical-align:middle;margin-left:4px}.toggle.sm-t button{padding:4px 10px;font-size:12px;min-height:0}
.cs-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-radius:8px;background:rgba(255,138,61,.12);border:1px solid rgba(255,138,61,.35)}.cs-top p{margin:0}
/* pretemporada */
.pre{display:flex;flex-direction:column;gap:14px;max-width:1100px}
.pre-riv{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:10px}
.pre-r{display:flex;align-items:center;gap:6px;border-radius:8px;background:rgba(255,255,255,.04);padding:4px 8px 4px 4px;border:1px solid transparent}.pre-r.on{border-color:var(--accent);background:rgba(255,138,61,.08)}
.pre-rb{flex:1;display:flex;align-items:center;gap:10px;text-align:left;padding:6px;background:none;border:0;color:var(--text);min-width:0}.pre-rb>span{display:flex;flex-direction:column;min-width:0}.pre-rb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pre-sum{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.pre-sum>div:first-child{display:flex;flex-direction:column;gap:4px}
/* panel cambios ataque-defensa */
.ad-btn{min-height:36px;padding:0 14px;font-size:13px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.5);color:#cfe0ff}.ad-btn.on{background:#3b82f6;color:#fff}
.ad-n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:#fff;color:#1d4ed8;font-size:11px;font-weight:700;margin-left:4px}
.ad-panel{margin-bottom:14px}
.ad-list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.ad-row{display:grid;grid-template-columns:150px 200px 24px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.035)}
@media (max-width:900px){.ad-row{grid-template-columns:1fr 1fr}.ad-arrow{display:none}.ad-opts{grid-column:1/-1}}
.ad-pos{display:flex;flex-direction:column;font-weight:600;font-size:13px}
.ad-p{display:flex;flex-direction:column;position:relative;padding-left:16px}.ad-p i,.ad-o i,.lg-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.ad-p i{position:absolute;left:0;top:5px}
.ad-arrow{color:var(--muted);font-size:18px;text-align:center}
.ad-opts{display:flex;flex-wrap:wrap;gap:6px}
.ad-o{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);font-size:12.5px}
.ad-o.def i,.lg-dot.def{background:#3b82f6}.ad-o.on{border-color:var(--accent);background:rgba(255,138,61,.14)}.ad-o.def.on{border-color:#3b82f6;background:rgba(59,130,246,.2)}
.lg-dot{vertical-align:middle;margin:0 2px}
.tok.swd .tok-c{background:#2563eb!important;border-color:#93c5fd!important;color:#fff!important}
.tag-def{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:3px;background:#3b82f6;color:#fff;vertical-align:middle}
.sq-r.dspec .d-pos{color:#93c5fd}.ad-live{margin:6px 0 8px;width:100%;justify-content:center}
/* partido en vivo a pantalla completa, sin doble scroll */
.lv-ticker{display:flex;flex-direction:column;gap:2px;margin-top:2px}.lv-ticker .feed-r{padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.035)}
.bench-sep{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:10px 4px 4px;border-top:1px solid var(--line);margin-top:4px}
.bench-r.nc{opacity:.55}.bench-r{position:relative}
.conv{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted);flex:none;margin-right:2px}
.conv.on{background:var(--green);border-color:var(--green);color:#0b1a12}
#lv-panel .feed{max-height:none;overflow:visible}
@media (min-width:861px){
  .main.live-fit{gap:10px;padding-top:12px;padding-bottom:12px}
  .main.live-fit>.live-board{flex:none;padding:8px 18px}
  .main.live-fit .live-board .sb-score{font-size:40px}
  .main.live-fit>.live-wrap{flex:1;min-height:0;margin:0;display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"main side";grid-template-rows:minmax(0,1fr);gap:14px;align-items:stretch}
  .main.live-fit .live-main{display:flex;flex-direction:column;min-height:0}
  .main.live-fit .court2d{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#16283A}
  .main.live-fit .court2d canvas{width:auto}
  .main.live-fit .live-ctl{margin:10px 0 6px;flex:none}
  .main.live-fit .lv-ticker{flex:none}
  .main.live-fit .live-side{position:static;min-height:0;display:flex;flex-direction:column;gap:10px}
  .main.live-fit .lpanel{flex:1;min-height:0;display:flex;flex-direction:column}
  .main.live-fit #lv-panel{flex:1;min-height:0;max-height:none;overflow:auto}
  .main.live-fit .live-side>.card:last-child{flex:none}
  .main.live-fit .sq-r{padding-top:4px;padding-bottom:4px}
}
.ltabs{display:grid!important;grid-template-columns:repeat(4,1fr)}.ltabs button{padding-left:4px!important;padding-right:4px!important;font-size:13px}
.bench-r:has(.conv){grid-template-columns:22px 30px minmax(0,1fr) auto auto}
#lv-panel .feed-r{grid-template-columns:30px 1fr auto;gap:6px 8px;padding:8px 2px}#lv-panel .feed-r .f-tag{grid-column:2;justify-self:start}#lv-panel .feed-r>span:nth-child(3){grid-column:1/-1}
.ptag.duel{background:rgba(59,130,246,.18);color:#93c5fd}
/* Próximo partido en una sola pantalla */
.ad-back{position:fixed;inset:0;background:rgba(5,9,13,.65);z-index:60}
.ad-panel{position:fixed!important;left:50%;top:5vh;transform:translateX(-50%);width:min(1000px,94vw);max-height:90vh;overflow:auto;z-index:61;margin:0!important;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.ad-close-w{display:flex;align-items:center;gap:10px}.ad-x{min-height:32px;padding:0 14px}
@media (min-width:861px){
  .main.tac-fit{padding-top:12px;padding-bottom:12px}
  .main.tac-fit>.tactics{flex:1;min-height:0;grid-template-columns:minmax(0,1fr) 320px;align-items:stretch;gap:14px}
  .main.tac-fit .t-main{display:flex;flex-direction:column;min-height:0;gap:8px}
  .main.tac-fit .t-head{flex:none;margin:0;flex-wrap:nowrap}
  .main.tac-fit .t-head>p{flex:1;min-width:0;font-size:12.5px;line-height:1.35;margin:0;max-height:3.6em;overflow:auto}
  .main.tac-fit .t-controls.info{display:none}
  .main.tac-fit .t-court-row{flex:1;min-height:0;grid-template-columns:auto minmax(240px,1fr);align-items:stretch;gap:12px}
  .main.tac-fit .court{height:100%;width:auto;max-width:100%;aspect-ratio:1/1;align-self:start;max-height:100%}
  .main.tac-fit .t-side{min-height:0;gap:8px}
  .main.tac-fit .t-side>.card.tight:first-child:not(:last-child){flex:none;max-height:130px;overflow:auto}
  .main.tac-fit .t-side>.card.tight:has(.bench){flex:1;min-height:0;display:flex;flex-direction:column}
  .main.tac-fit .bench{flex:1;min-height:0;overflow:auto;max-height:none}
  .main.tac-fit .t-side>.btn{flex:none}
  .main.tac-fit .tactic-more{flex:none;margin:0;padding:10px 14px;gap:14px}
  .main.tac-fit .tactic-more p{display:none}
  .main.tac-fit .t-panel{position:static;min-height:0;overflow:auto}
}

/* ===== Arqueros: arco por alturas y especialidades ===== */
.gk-box{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start;margin:8px 0 12px}
.goal-svg{width:100%;max-width:170px;color:var(--text);display:block}
.goal-svg .gz-l{font-size:7px;fill:var(--text);opacity:.85}
.goal-svg .gz-v{font-size:7.5px;font-weight:700;fill:var(--text)}
.gk-specs{display:flex;flex-direction:column;gap:6px}
.gk-sp{display:flex;flex-direction:column;border-left:3px solid var(--green);padding:2px 0 2px 8px;line-height:1.25}
.gk-sp.weak{border-left-color:var(--red)}
.gk-sp .sm{font-size:12px}
.gk-rep{display:flex;flex-wrap:wrap;gap:12px;margin:8px 0 4px}
.gk-rep-i{display:flex;flex-direction:column;gap:2px;width:150px}
@media (max-width:600px){.gk-box{grid-template-columns:1fr}}

/* ===== Notas, mapa de tiros y consejos del ayudante ===== */
.nota{display:inline-block;min-width:34px;padding:2px 6px;border-radius:6px;font-weight:800;font-size:13px;text-align:center;color:#0b1118}
.nota.big{font-size:22px;padding:6px 10px;margin-left:auto}
.nota.n-top{background:#3ddc84}.nota.n-good{background:#9fd86b}.nota.n-ok{background:#e0b44a}.nota.n-bad{background:#e05a4f;color:#fff}
.mvp-card{display:flex;align-items:center;gap:14px}
.rt-card{margin-bottom:16px}
.rt-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
.rt-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.tbl.rt td,.tbl.rt th{padding:5px 6px;font-size:13px}
@media (max-width:900px){.rt-grid{grid-template-columns:1fr}}
.shotmap{width:100%;display:block;border-radius:8px;margin:8px 0 4px;background:#16301f}
.dot-k{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px;vertical-align:middle}
.dot-k:first-child{margin-left:0}
.advice{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:rgba(80,140,255,.12);border:1px solid rgba(80,140,255,.35);border-radius:10px;padding:6px 10px;width:100%}
.advice .sm{flex:1;min-width:180px}

/* ===== Pantalla de carga al pasar de día ===== */
.load-ov{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(6,10,15,.88);backdrop-filter:blur(4px);animation:ldin .18s ease-out}
.load-ov.out{opacity:0;transition:opacity .2s}
@keyframes ldin{from{opacity:0}to{opacity:1}}
.load-box{width:min(420px,86vw);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.load-d{font-size:22px}
.load-bar{width:100%;height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.load-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px}
.load-row{width:100%;display:flex;justify-content:space-between;align-items:center}
.load-p{font-weight:800;font-variant-numeric:tabular-nums}

/* ===== Barra lateral en acordeón ===== */
.ngrp{display:flex;flex-direction:column}
.grp-b{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;color:var(--muted);font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.1em;padding:12px 10px 8px;cursor:pointer;text-align:left;border-radius:8px}
.grp-b:hover{color:var(--text)}
.ngrp.open .grp-b{color:var(--text)}
.grp-b .chev{width:12px;height:12px;margin-left:auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s}
.ngrp.open .grp-b .chev{transform:rotate(180deg)}
.grp-dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ngrp.open .grp-dot{display:none}
.grp-items{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s ease}
.grp-items>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:2px}
.ngrp.open .grp-items{grid-template-rows:1fr}
@media (max-width:860px){
  .nav-scroll{flex-direction:row}
  .ngrp{flex-direction:row}.grp-b{display:none}
  .grp-items,.ngrp.open .grp-items{display:flex;grid-template-rows:none}
  .grp-items>div{flex-direction:row;overflow:visible}
}

/* ===== Páginas en lugar de scroll ===== */
.ap-pager{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:8px 14px;min-height:46px;box-sizing:border-box}
.ap-pager:empty{min-height:0;padding:0}
.ap-pager .chip{min-width:40px;font-size:18px;line-height:1}
.ptabs{display:inline-flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.ptabs button{background:none;border:0;color:var(--muted);font:inherit;font-weight:600;padding:8px 16px;border-radius:9px;cursor:pointer}
.ptabs button.on{background:var(--accent);color:#111}
.pt-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.pt-head .ptabs{margin:0}
.lg-pick{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pt-head .lg-pick{margin:0}
.lg-sel{min-width:280px;max-width:420px}
.tbl.tight td{padding-top:6px;padding-bottom:6px}
.fit-side{overflow:auto;position:sticky;top:0}
.sq-side.fit-side{display:flex;flex-direction:column;gap:16px}
@media (min-width:1181px){
  .model-grid{grid-template-columns:1fr 1fr 1fr;gap:14px;margin-top:8px}
  .mcol{display:flex;flex-direction:column;gap:14px}
  .mdl .mq{margin-top:10px}.mdl .mq p{font-size:12px}
}
@media (max-width:1180px){.mcol{display:contents}}
.tbl.tight .face-s{width:30px;height:30px}
.tbl.tight .pn .muted.sm{font-size:11.5px}
.squad,.mk-wrap{align-items:start}
.fit-side .ptabs{display:flex;width:100%;box-sizing:border-box}
.fit-side .ptabs button{flex:1;padding:7px 8px;font-size:13px}
@media (min-width:861px){
  .mk-head{margin-bottom:12px}
  .mk-head .mk-stat{padding:10px 18px}
  .mk-head .mk-stat b{font-size:22px}
  .mk-filters{margin-bottom:10px}
}

/* ===== Próximo partido estilo FIFA ===== */
.tm{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.tm-left{display:flex;flex-direction:column;gap:10px;min-width:0}
.tm-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tm-tabs{display:inline-flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px}
.tm-tabs button{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:14px;padding:8px 18px;border-radius:9px;cursor:pointer;letter-spacing:.02em}
.tm-tabs button.on{background:var(--accent);color:#111}
.tm-sp{flex:1}
.tm-lvl{font-size:13px;color:var(--muted)}.tm-lvl b{color:var(--text);font-size:15px}
.toggle.sm-t button{padding:6px 12px;font-size:13px}
.tm-hint{font-size:13px;color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:7px 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tm-hint .kicker{margin-right:6px;color:var(--accent)}
.tm-hint b{color:var(--text)}
.tm-court.court{aspect-ratio:auto;height:460px;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,#2f6fb0 0%,#24558a 55%,#1b416b 100%);box-shadow:inset 0 0 0 8px rgba(0,0,0,.18),0 10px 30px rgba(0,0,0,.35)}
.tm-court .court-svg{opacity:.95}
/* cartas */
.pcw{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;width:auto!important;display:block;transition:left .35s ease,top .35s ease}
.pcw.sub{position:relative;transform:none}
.pc{position:relative;display:flex;flex-direction:column;align-items:center;width:84px;padding:5px 5px 6px;border-radius:10px 10px 12px 12px;color:#14110a;box-shadow:0 6px 14px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);transition:transform .15s,box-shadow .15s}
.pc.oro{background:linear-gradient(160deg,#fff1b8 0%,#e7c25a 45%,#b98a2a 100%)}
.pc.plata{background:linear-gradient(160deg,#ffffff 0%,#cfd6dd 50%,#8e99a4 100%)}
.pc.bronce{background:linear-gradient(160deg,#f6d2b4 0%,#c98955 50%,#8a5530 100%)}
.pc-top{display:flex;width:100%;justify-content:space-between;align-items:baseline;line-height:1;padding:0 2px}
.pc-r{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:800}
.pc-p{font-size:10px;font-weight:800;letter-spacing:.04em;opacity:.8}
.pc-f{width:46px;height:46px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.35);margin-top:1px}
.pc-f svg{width:100%;height:100%;display:block}
.pc-n{font-size:11.5px;font-weight:800;max-width:78px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.pc-tag{font-size:9.5px;font-weight:800;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.65);color:#fff;margin-top:2px;white-space:nowrap}
.pc-tag.warn{background:#c2410c}.pc-tag.bad{background:#b91c1c}.pc-tag.r-ant{background:#7c3aed}.pc-tag.r-blo{background:#0f766e}
.pc-e{display:block;width:70px;height:4px;border-radius:2px;background:rgba(0,0,0,.25);margin-top:4px;overflow:hidden}
.pc-e i{display:block;height:100%}
.pc.na{filter:grayscale(.8) brightness(.75)}
.pc.spec{outline:3px solid #3b82f6;outline-offset:1px}
.pcw:hover .pc{transform:translateY(-3px)}
.pcw.on .pc{box-shadow:0 0 0 3px var(--accent),0 0 18px rgba(255,138,61,.6),0 6px 14px rgba(0,0,0,.45)}
.pcw.drop .pc{box-shadow:0 0 0 3px var(--green),0 0 18px rgba(61,214,140,.6)}
.court.awaiting .pcw .pc{animation:pulse 1.2s infinite}
.tok.pcw.swd::after{top:-8px;right:-8px}
/* suplentes */
.tm-subs{padding:10px 12px}
.tm-subs-h{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tm-strip{display:flex;gap:10px;justify-content:flex-start}
.subw{position:relative}
.subw .pc{width:76px}.subw .pc-f{width:40px;height:40px}.subw .pc-r{font-size:19px}
.subw .conv{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:2px solid var(--bg,#0d141b);background:#334155;color:#fff;font-size:12px;font-weight:800;cursor:pointer;display:grid;place-items:center;padding:0;z-index:2}
.subw .conv.on{background:var(--green);color:#06260f}
/* indicaciones */
.tm-ind{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
.tm-ind .card .btn{margin-top:10px}
/* ficha grande */
.tm-panel{padding:16px 18px}
.fp{display:flex;flex-direction:column;gap:10px}
.fp-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.fp-face{position:relative;width:78px;height:78px;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.02));border:1px solid var(--line)}
.fp-face svg{width:100%;height:100%}
.fp-num{position:absolute;left:4px;bottom:3px;font-size:12px;font-weight:800;background:rgba(0,0,0,.6);border-radius:5px;padding:0 5px}
.fp-id{display:flex;flex-direction:column;min-width:0}
.fp-name{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;line-height:1.05;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.fp-ovr{display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:64px;border-radius:12px;color:#14110a}
.fp-ovr b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:32px;line-height:1}
.fp-ovr span{font-size:9.5px;font-weight:800;letter-spacing:.08em}
.fp-ovr.oro{background:linear-gradient(160deg,#fff1b8,#d9ae45)}.fp-ovr.plata{background:linear-gradient(160deg,#fff,#aab4be)}.fp-ovr.bronce{background:linear-gradient(160deg,#f6d2b4,#b9763f)}
.fp-chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fp-chip{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:6px 10px;display:flex;flex-direction:column}
.fp-chip span{font-size:10.5px;color:var(--muted);letter-spacing:.04em}
.fp-chip b{font-size:15px}
.t-top{color:#3ddc84}.t-good{color:#9fd86b}.t-ok{color:#e0b44a}.t-bad{color:#e05a4f}
.fp-st{font-size:13px;font-weight:700;text-align:center;border-radius:8px;padding:6px}
.fp-st.ok{background:rgba(61,214,140,.12);color:var(--green)}.fp-st.warn{background:rgba(255,138,61,.12);color:var(--accent)}.fp-st.bad{background:rgba(224,90,79,.14);color:#f08a80}
.fp-cols{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px}
.fp-a{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.fp-a span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fp-a b{font-size:14px;text-align:right}
.fp-gk .goal-svg{max-width:150px;margin-top:6px}
.fp-ins{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fp-ins .kicker{margin-right:4px}
.fp-cands{display:flex;flex-direction:column;gap:4px}
.fp-cand{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:5px 8px;color:inherit;font:inherit;cursor:pointer;text-align:left}
.fp-cand:hover{border-color:var(--accent)}
.fp-cand .face-s{width:28px;height:28px}
.pc-mini{min-width:34px;text-align:center;border-radius:6px;padding:2px 4px;color:#14110a;font-weight:800}
.pc-mini.oro{background:#e7c25a}.pc-mini.plata{background:#cfd6dd}.pc-mini.bronce{background:#c98955}
@media (min-width:861px){
  .main.tm-fit>.tm{flex:1;min-height:0;align-items:stretch}
  .main.tm-fit .tm-left{min-height:0}
  .main.tm-fit .tm-court{flex:1;height:auto;min-height:300px}
  .main.tm-fit .tm-ind{flex:1;min-height:0;overflow:auto}
  .main.tm-fit .tm-panel{min-height:0;overflow:auto}
}
@media (max-width:1180px){.tm{grid-template-columns:1fr}.tm-strip{flex-wrap:wrap}}
@media (max-width:860px){.tm-court.court{height:auto;aspect-ratio:1/1}.pc{width:66px}.pc-f{width:34px;height:34px}.pc-r{font-size:17px}.pc-n{font-size:10px;max-width:60px}.tm-ind{grid-template-columns:1fr}}
.tm-court .court-svg *{vector-effect:non-scaling-stroke}
.tm-court .pc{transform:scale(var(--cs,1))}
.tm-court .pcw:hover .pc{transform:scale(calc(var(--cs,1)*1.05))}
.tm-strip{gap:8px;flex-wrap:nowrap}
.subw{width:calc(78px*var(--ss,1));height:calc(122px*var(--ss,1));flex:none}
.subw .pc{width:78px;transform:scale(var(--ss,1));transform-origin:top left}
.subw .pcw:hover .pc{transform:scale(var(--ss,1)) translateY(-3px)}
@media (max-width:1440px){
  .tm{grid-template-columns:minmax(0,1fr) 330px}
  .tm-tabs button{padding:7px 12px;font-size:13px}
  .fp-name{font-size:20px}.fp-face{width:64px;height:64px}.fp-ovr{width:56px;height:56px}.fp-ovr b{font-size:27px}
  .fp-a{font-size:12.5px;padding:3px 0}
}
@media (max-width:1440px){.tm-hint{-webkit-line-clamp:1}}

/* ===== Cambios ataque-defensa más simple ===== */
.ad2{width:min(860px,94vw)!important}
.ad2-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.ad2-top p{margin:4px 0 0}
.ad2-sum{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0 10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.ad2-who{margin-right:auto}
.ad2-lvl{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.ad2-lvl b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:30px}
.ad2-lvl.now b{color:#60a5fa}
.ad2-arrow{font-size:20px;color:var(--muted);text-align:center}
.ad2-arrow.big{font-size:24px}
.ad-gain{font-weight:800;font-size:13px}
.ad2-note{margin:0 0 8px;color:var(--muted)}
.ad2-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.ad2-row{border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025)}
.ad2-row.has{border-color:rgba(59,130,246,.55);background:rgba(59,130,246,.08)}
.ad2-row.open{border-color:var(--accent)}
.ad2-main{display:grid;grid-template-columns:120px auto 30px 1fr auto;gap:12px;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;padding:6px 12px;cursor:pointer}
.ad2-pos{display:flex;flex-direction:column;line-height:1.2}
.ad2-pos b{font-size:16px}
.ad-out .pc,.ad-in .pc{width:64px;padding:3px 4px 4px;transform:none}
.ad-out .pc-f,.ad-in .pc-f{width:30px;height:30px}
.ad-out .pc-r,.ad-in .pc-r{font-size:17px}.ad-out .pc-n,.ad-in .pc-n{font-size:10px;max-width:58px}
.ad-in{display:flex;align-items:center;gap:10px}
.ad-same{display:flex;flex-direction:column;line-height:1.3}
.ad2-edit{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
.ad2-pick{padding:4px 12px 12px;border-top:1px dashed var(--line)}
.ad2-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ad2 .ad-o{gap:6px;padding:7px 12px;font-size:13px;cursor:pointer}
@media (max-width:700px){.ad2-main{grid-template-columns:auto 24px 1fr}.ad2-pos,.ad2-edit{display:none}}
.pmini{display:inline-flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);min-width:170px}
.pmini.spec{background:rgba(59,130,246,.18);border-color:#3b82f6}
.pmini .face-s{width:32px;height:32px}
.pm-n{display:flex;flex-direction:column;line-height:1.15;font-weight:700;font-size:13.5px;flex:1}
.pmini .pc-mini{font-size:15px}
.ad2-main{grid-template-columns:120px auto 26px 1fr auto;padding:6px 12px}
.ad-gain.muted{color:var(--muted)}
.ad-out .pmini,.ad-in .pmini{width:230px;box-sizing:border-box}

/* ===== Reconversión de puesto ===== */
.rt-card{margin-top:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.rt-card p{margin:0}
.rt-h{display:flex;justify-content:space-between;align-items:baseline}
.rt-h b{font-size:18px}
.rt-bar{position:relative;display:block;height:16px;border-radius:8px;background:rgba(255,255,255,.08);overflow:hidden}
.rt-bar i{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:8px;transition:width .4s}
.rt-bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800}
.rt-bar.sm-bar{height:12px;width:120px}
.rt-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rt-o{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;text-align:left}
.rt-o:hover{border-color:#60a5fa;background:rgba(59,130,246,.12)}
.rt-o b{font-size:17px}
.rt-tag{display:inline-block;margin-left:4px;font-size:10px;font-weight:800;color:#93c5fd;background:rgba(59,130,246,.18);border-radius:5px;padding:1px 4px;vertical-align:middle}
.rt-rows{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rt-row{display:grid;grid-template-columns:32px 1fr auto 130px auto;gap:10px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:6px 10px;color:inherit;font:inherit;cursor:pointer;text-align:left}
.rt-row:hover{border-color:#60a5fa}

/* ===== Analista de mercado ===== */
.ana-list{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.ana-r{display:grid;grid-template-columns:48px 1fr auto auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.ana-face{width:48px;height:48px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.08)}
.ana-face svg{width:100%;height:100%}
.ana-t{display:flex;flex-direction:column;gap:2px;line-height:1.35}
.ana-r .pc-mini{font-size:17px;padding:4px 8px}
.tag.rec{background:rgba(59,130,246,.2);color:#93c5fd;border-color:rgba(59,130,246,.5)}

/* ===== Conferencia post partido ===== */
.pp{display:flex;flex-direction:column;gap:14px}
.pp-scene{border-radius:16px;overflow:hidden}
.pp-scene .scene{height:clamp(200px,30vh,330px)}
.sbug{position:absolute;left:16px;top:14px;display:flex;align-items:center;gap:8px;background:rgba(8,13,18,.88);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;font-family:"Barlow Condensed",sans-serif}
.sbug b{font-size:16px;letter-spacing:.04em}
.sb-sc{font-size:24px;font-weight:800;padding:0 6px;background:var(--accent);color:#111;border-radius:6px}.sb-sc i{font-style:normal;margin:0 4px;opacity:.6}
.sb-ft{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em;margin-left:4px}
.pp-lower{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 18px;background:linear-gradient(90deg,rgba(8,13,18,.95),rgba(8,13,18,.7));border-top:3px solid var(--accent)}
.pp-lower b{font-family:"Barlow Condensed",sans-serif;font-size:20px;letter-spacing:.06em}
.pp-lower span:last-child{color:var(--muted);font-size:13px}
.pp-live{background:#dc2626;color:#fff;font-size:11px;font-weight:800;letter-spacing:.1em;padding:3px 7px;border-radius:4px;animation:pulse 1.6s infinite}
.pp-q{display:flex;flex-direction:column;gap:12px}
.pp-rep{display:flex;align-items:center;gap:12px}
.pp-rep>div:nth-child(2){display:flex;flex-direction:column}
.pp-face{width:46px;height:46px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.08)}.pp-face svg{width:100%;height:100%}
.pp-dots{margin-left:auto;display:flex;align-items:center;gap:6px}
.pp-dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.15)}.pp-dots i.on{background:var(--accent)}.pp-dots i.done{background:var(--green)}
.pp-dots span{margin-left:6px}
.pp-bubble{position:relative;font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;line-height:1.2;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.pp-bubble::before{content:"";position:absolute;left:22px;top:-9px;width:16px;height:16px;background:inherit;border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg);background-color:#1a2530}
.pp-ans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pp-a{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px 14px;border-radius:12px;background:var(--panel2,rgba(255,255,255,.04));border:1px solid var(--line);color:inherit;font:inherit;cursor:pointer;transition:border-color .15s,transform .15s}
.pp-a:hover{border-color:var(--accent);transform:translateY(-2px)}
.pp-k{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent)}
.pp-t{font-size:15px;line-height:1.35;flex:1}
.pp-ef{display:flex;flex-wrap:wrap;gap:5px}
.ef{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.07)}
.ef.up{color:#4ade80;background:rgba(74,222,128,.12)}.ef.dn{color:#f87171;background:rgba(248,113,113,.12)}.ef.nt{color:var(--muted)}
.pp-react{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-left:3px solid var(--accent);background:rgba(255,255,255,.03);border-radius:8px}
.pp-react p{margin:0}.pp-react p:first-of-type{font-size:16px;font-style:italic}
.pp-react .btn{align-self:flex-start;margin-top:6px}
.pp-end .headline{margin-top:4px}
.pp-heads{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.pp-sum{max-width:520px;margin-bottom:12px}
.pp-call{display:grid;grid-template-columns:280px 1fr;gap:0;padding:0!important;overflow:hidden;margin-bottom:14px}
.pp-call-img .scene{height:150px}
.pp-call-t{display:flex;flex-direction:column;gap:4px;padding:16px 20px;justify-content:center}
.pp-call-t b{font-family:"Barlow Condensed",sans-serif;font-size:24px}
@media (max-width:900px){.pp-ans{grid-template-columns:1fr}.pp-call{grid-template-columns:1fr}.pp-bubble{font-size:20px}}
.pp-scene .scene{height:auto;aspect-ratio:1720/400;max-height:34vh;width:100%}
.pp-call-img .scene{height:auto;aspect-ratio:1100/400;width:100%}
.pp-call{grid-template-columns:420px 1fr}
.pp-scene .scene{aspect-ratio:auto;height:clamp(220px,33vh,330px);max-height:none}
.pp-scene{display:flex;flex-direction:column}
.pp-scene .pp-lower{position:static}
.pp-scene .scene{height:clamp(200px,29vh,290px)}

/* ===== Reuniones con jugadores ===== */
.meet{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
.meet-p{display:flex;flex-direction:column;gap:6px}
.meet-face{width:150px;height:150px;border-radius:20px;overflow:hidden;align-self:center;margin:8px 0 4px;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.meet-face.oro{background:linear-gradient(160deg,#fff1b8,#b98a2a)}.meet-face.plata{background:linear-gradient(160deg,#fff,#8e99a4)}.meet-face.bronce{background:linear-gradient(160deg,#f6d2b4,#8a5530)}
.meet-face svg{width:100%;height:100%}
.meet-n{font-family:"Barlow Condensed",sans-serif;font-size:26px;text-align:center;line-height:1.1}
.meet-p>.sm.muted:first-of-type{text-align:center}
.pmbar.big{display:block;width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}.pmbar.big i{display:block;height:100%}
.meet-c{display:flex;flex-direction:column;gap:12px;min-height:420px}
.chat{display:flex;flex-direction:column;gap:10px;padding:6px 0}
.msg{display:flex;align-items:flex-end;gap:10px;max-width:78%}
.msg.him{align-self:flex-start}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg-f{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none;background:rgba(255,255,255,.08)}.msg-f svg{width:100%;height:100%}
.msg-b{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.4;display:flex;flex-direction:column;gap:3px}

  const words = name.replace(/[()]/g, "").split(/\s+/).filter(w => !skip.has(w)).map(w => w.replace(/\./g, "")).filter(w => w.length > 1);
  const w = words.length ? words : [name.replace(/[^A-Za-zÀ-ÿ]/g, "")];

function strength(ci) {
  const m = ROSTER[ci].map(pid => P(pid)[3]).sort((a, b) => b - a).slice(0, 7);
  return m.reduce((a, b) => a + b, 0) / Math.max(1, m.length);

function form(lg, ci) {
  const out = [];
  for (let r = lg.round - 1; r >= 0 && out.length < 5; r--) {
    const m = (lg.results[r] || []).find(x => x.h === ci || x.a === ci);
    if (!m || m.pending) continue;
    const gf = m.h === ci ? m.hg : m.ag, gc = m.h === ci ? m.ag : m.hg;
    out.push(gf > gc ? "G" : gf < gc ? "P" : "E");
  }
  return out.reverse();
}

  const lgId = G.clubLeague[ci], L = LEAGUES[lgId];
  const ids = G.S.leagues[lgId].clubs.slice().sort((a, b) => strength(b) - strength(a));
  const rank = ids.indexOf(ci) + 1, n = ids.length;
  if (rank === 1) return { text: "Salir campeón", target: 1 };
  if (rank <= 3) return { text: "Terminar entre los 3 primeros", target: 3 };
  if (L.div === 2 && rank <= 6) return { text: "Pelear el ascenso (top 4)", target: 4 };
  if (rank <= Math.ceil(n / 2)) return { text: "Terminar en la mitad de arriba", target: Math.ceil(n / 2) };
  return L.div === 1 ? { text: "Mantener la categoría", target: n - L.down } : { text: "Terminar fuera de los últimos dos puestos", target: n - 2 };
}

function effChips(eff) {

}
function matchChip(m, small) {

  let r = ""; if (res) { const gf = m.h === G.myClub ? res.hg : res.ag, gc = m.h === G.myClub ? res.ag : res.hg; r = `<span class="fm fm-${gf > gc ? "G" : gf < gc ? "P" : "E"}">${res.hg}–${res.ag}</span>`; }

function styleCard(mon) {
  const st = (G.weekStyle || {})[mon] || "equilibrado", open = UI.styleMenu === mon, past = mon + 6 < G.day;
  return `<div class="wstyle-wrap"><button class="wstyle ${open ? "on" : ""}" ${past ? "disabled" : `data-stylemenu="${mon}"`}><b>${STYLES[st].n}</b><span>Orientación</span></button>
    ${open ? `<div class="wmenu">${Object.entries(STYLES).map(([k, t]) => `<button class="${k === st ? "on" : ""}" data-wstyle="${k}" data-mon="${mon}"><b>${t.n}</b><span>${t.d}</span></button>`).join("")}</div>` : ""}</div>`;
}
function vCalendar() {
  const tab = UI.calTab || "mes";
  const tabs = `<div class="cal-head"><div class="toggle" role="group" aria-label="Vista">${[["mes", "Mes"], ["semana", "Semana"], ["partidos", "Partidos"]].map(([k, l]) => `<button class="${tab === k ? "on" : ""}" data-caltab="${k}">${l}</button>`).join("")}</div>`;
  if (tab === "partidos") return tabs + `</div>` + vFixtures();
  const md = matchDays(), last = seasonLastDay();
  if (tab === "semana") {
    const mon = UI.calWeek != null ? UI.calWeek : mondayOf(G.day);
    const d0 = dayDate(mon), d6 = dayDate(mon + 6);
    const head = `${tabs}<button class="navb" data-calweek="${mon - 7}" ${mon - 7 < mondayOf(0) ? "disabled" : ""}>‹</button><span class="cal-title">${d0.getDate()} ${MESES[d0.getMonth()].slice(0, 3)} – ${d6.getDate()} ${MESES[d6.getMonth()].slice(0, 3)} ${d6.getFullYear()}</span><button class="navb" data-calweek="${mon + 7}" ${mon + 7 > last ? "disabled" : ""}>›</button><button class="chip" data-calweek="${mondayOf(G.day)}">Hoy</button></div>`;
    let cols = "";
    for (let i = 0; i < 7; i++) {
      const d = mon + i, date = dayDate(d), pl = planFor(d, md), ed = d >= G.day && d <= last && !md[d], ld = dayLoad(d, md);
      cols += `<div class="wk-day ${d === G.day ? "today" : ""} ${d < G.day ? "past" : ""}"><div class="wk-h"><span>${DIAS[date.getDay()]}</span><b>${date.getDate()}</b></div>
        ${md[d] ? matchChip(md[d]) : ""}
        ${pl.map((k, j) => k === "partido" ? "" : `<div class="wk-slot"><span class="wk-sl">${SLOTS[j]}</span>${sessChip(k, d, j, ed)}</div>`).join("")}
        ${d <= last ? `<div class="wk-load"><span>Carga</span><span class="ld"><i style="width:${Math.max(0, Math.min(100, ld * 10))}%;background:${ld >= 8 ? "var(--red)" : ld >= 5 ? "var(--accent)" : "var(--green)"}"></i></span></div>` : ""}</div>`;
    }
    return `${head}<div class="wk-wrap"><div class="wk-side">${styleCard(mon)}${weekSummary()}</div><div class="wk-grid">${cols}</div></div>${UI.slot ? sessPicker() : `<p class="sm muted">Tocá un turno para cambiar lo que se trabaja. Los días ya pasados y los de partido no se pueden modificar.</p>`}`;
  }
  // vista mes
  const ym = UI.calMonth || (() => { const t = dayDate(G.day); return [t.getFullYear(), t.getMonth()]; })();
  const first = new Date(ym[0], ym[1], 1, 12), base = seasonStart(G.season);
  const firstDay = Math.round((first - base) / 864e5), startMon = mondayOf(firstDay);
  const lastOfMonth = new Date(ym[0], ym[1] + 1, 0, 12), lastDay = Math.round((lastOfMonth - base) / 864e5);
  const prevM = ym[1] === 0 ? [ym[0] - 1, 11] : [ym[0], ym[1] - 1], nextM = ym[1] === 11 ? [ym[0] + 1, 0] : [ym[0], ym[1] + 1];
  const head = `${tabs}<button class="navb" data-calmonth="${prevM.join("-")}" ${firstDay <= 0 ? "disabled" : ""}>‹</button><span class="cal-title">${MESES[ym[1]][0].toUpperCase() + MESES[ym[1]].slice(1)} ${ym[0]}</span><button class="navb" data-calmonth="${nextM.join("-")}" ${lastDay >= last ? "disabled" : ""}>›</button><button class="chip" data-calmonth="today">Hoy</button></div>`;
  let rows = "";
  for (let mon = startMon; mon <= lastDay; mon += 7) {
    if (mon + 6 < 0 || mon > last) continue;
    let cells = "";
    for (let i = 0; i < 7; i++) {
      const d = mon + i, date = dayDate(d), inSeason = d >= 0 && d <= last, out = date.getMonth() !== ym[1];
      if (!inSeason) { cells += `<div class="mc-day off"><span class="mc-n">${date.getDate()}</span></div>`; continue; }
      const pl = planFor(d, md);
      cells += `<button class="mc-day ${d === G.day ? "today" : ""} ${d < G.day ? "past" : ""} ${out ? "other" : ""}" data-calday="${d}"><span class="mc-n">${date.getDate()}${date.getDate() === 1 || d === startMon ? " " + MESES[date.getMonth()].slice(0, 3) : ""}</span>
        ${md[d] ? matchChip(md[d], true) : ""}${pl.map((k, j) => k === "partido" ? "" : `<span class="mc-s" style="--cc:${CATS[(SESS[k] || SESS.descanso).c].color}">${esc((SESS[k] || SESS.descanso).n)}</span>`).join("")}</button>`;

  }
  return `${head}<div class="mc-grid"><div class="mc-row mc-hd"><div></div>${["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"].map(x => `<div>${x}</div>`).join("")}</div>${rows}</div>
    <div class="cal-legend">${Object.values(CATS).map(c => `<span><i style="background:${c.color}"></i>${c.name}</span>`).join("")}</div>`;

function weekSummary() {

// ---------- ESTADÍSTICAS ----------
function vStats() {
  const id = UI.statsLg || myLg(), set = new Set(G.S.leagues[id].clubs);
  const all = Object.entries(G.S.stats).map(([k, s]) => [+k, s]).filter(([pid]) => set.has(P(pid)[1]));
  const sc = all.filter(([pid, s]) => P(pid)[2] !== "AR" && s.g > 0).sort((a, b) => b[1].g - a[1].g).slice(0, 80);
  const maxSf = Math.max(1, ...all.filter(([pid]) => P(pid)[2] === "AR").map(([, s]) => s.sf));
  const gk = all.filter(([pid, s]) => P(pid)[2] === "AR" && s.sf >= maxSf * 0.4).sort((a, b) => b[1].sv / b[1].sf - a[1].sv / a[1].sf).slice(0, 60);
  const row = (i, pid, cells) => `<tr class="${P(pid)[1] === G.myClub ? "mine" : ""}"><td>${i + 1}</td><td class="tl"><div class="pn"><span class="face-s">${faceSVG(pid)}</span><div><b>${esc(P(pid)[0])}</b><div class="muted sm">${esc(club(P(pid)[1]).n)}</div></div></div></td>${cells}</tr>`;
  const asl = all.filter(([, s]) => s.as > 0).sort((a, b) => b[1].as - a[1].as).slice(0, 60);
  const maxPj = Math.max(1, ...all.map(([, s]) => s.rn || 0));
  const nt = all.filter(([, s]) => (s.rn || 0) >= Math.max(1, maxPj * 0.5)).sort((a, b) => b[1].rs / b[1].rn - a[1].rs / a[1].rn).slice(0, 60);
  const [tb, tabsH] = pageTabs("stats", [["g", "Goleadores"], ["gk", "Arqueros"], ["as", "Asistencias"], ["nt", "Notas"]]);
  const mk = (title, head, list, cells) => { const P2 = pg("st-" + tb, list, id); return `<div class="card flush"><div class="card-h"><span class="kicker">${title}</span></div>${list.length ? `<table class="tbl big" data-ap="st-${tb}"><thead><tr><th>#</th><th class="tl">JUGADOR</th>${head}</tr></thead><tbody>${P2.items.map(([pid, s], k) => row(P2.start + k, pid, cells(s))).join("")}</tbody></table>${P2.bar}` : '<p class="muted pad">Sin partidos jugados.</p>'}</div>`; };
  const body = tb === "g" ? mk("GOLEADORES", "<th>PJ</th><th>GOLES</th><th>TIROS</th><th>%</th>", sc, s => `<td>${s.pj}</td><td><b class="pts">${s.g}</b></td><td class="muted">${s.t}</td><td class="muted">${pct(s.g, s.t)}</td>`)
    : tb === "gk" ? mk("ARQUEROS", "<th>PJ</th><th>ATAJADAS</th><th>%</th>", gk, s => `<td>${s.pj}</td><td><b class="pts">${s.sv}</b></td><td class="muted">${pct(s.sv, s.sf)}</td>`)
    : tb === "as" ? mk("ASISTENCIAS", "<th>PJ</th><th>ASIST.</th>", asl, s => `<td>${s.pj}</td><td><b class="pts">${s.as}</b></td>`)
    : mk("MEJORES NOTAS", "<th>PJ</th><th>NOTA</th>", nt, s => `<td>${s.rn}</td><td><span class="nota ${notaCls(s.rs / s.rn / 10)}">${(s.rs / s.rn / 10).toFixed(1)}</span></td>`);
  return `<div class="pt-head">${lgSelect(id, "slg")}${tabsH}</div>${body}`;
}

function swapIn(pos, pid) {
  if (isInj(pid) || isSusp(pid)) { UI.modal = { title: "No está disponible", text: `${P(pid)[0]} no puede jugar: ${isInj(pid) ? "está lesionado" : "está suspendido"}.`, ok: "Entendido", run: () => render() }; render(); return; }
  const other = POS_ORDER.find(p => p !== pos && G.lineup[p] === pid);
  if (other) G.lineup[other] = G.lineup[pos];
  G.lineup[pos] = pid; UI.benchSel = null; UI.sel = pos; save(); render();
}
function defSwap(a, b) { if (a === b) return; const o = defOrder().slice(), i = o.indexOf(a), j = o.indexOf(b); o[i] = b; o[j] = a; setDefOrder(o); UI.sel = a; render(); }
function swapPos(a, b) { if (a === b) return; const t = G.lineup[a]; G.lineup[a] = G.lineup[b]; G.lineup[b] = t; UI.sel = b; save(); render(); }
function focusPanel() { if (window.innerWidth < 1180) { const el = document.querySelector(".t-panel"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); } }

let DRAG = null, SUPPRESS_CLICK = false;
document.addEventListener("pointerdown", e => {

});
document.addEventListener("pointermove", e => {
  if (!DRAG) return;

    DRAG.on = true;
    const pid = DRAG.tok ? G.lineup[DRAG.tok] : DRAG.bench, p = P(pid);

    document.body.appendChild(g); DRAG.ghost = g; DRAG.el.classList.add("dragging"); document.body.classList.add("is-dragging");
  }

  const under = document.elementFromPoint(e.clientX, e.clientY), t = under && under.closest(DRAG.tok ? "[data-tok],[data-bench]" : "[data-tok]");
  if (DRAG.over && DRAG.over !== t) DRAG.over.classList.remove("drop");
  DRAG.over = t && t !== DRAG.el ? t : null; if (DRAG.over) DRAG.over.classList.add("drop");
}, { passive: false });
function endDrag(e) {
  if (!DRAG) return;
  const d = DRAG; DRAG = null;
  if (!d.on) return;
  d.ghost.remove(); d.el.classList.remove("dragging"); document.body.classList.remove("is-dragging");
  SUPPRESS_CLICK = true; setTimeout(() => SUPPRESS_CLICK = false, 50);
  const t = d.over; if (!t) return;

}
document.addEventListener("pointerup", endDrag);
document.addEventListener("pointercancel", () => { if (DRAG && DRAG.ghost) { DRAG.ghost.remove(); DRAG.el.classList.remove("dragging"); document.body.classList.remove("is-dragging"); } DRAG = null; });

document.addEventListener("change", e => { if (e.target.dataset && e.target.dataset.lgsel) { if (e.target.dataset.lgsel === "lg") UI.lgView = e.target.value; else UI.statsLg = e.target.value; render(); return; } if (e.target.id === "cup-pick") { UI.cupSel = e.target.value; render(); } if (e.target.id === "news-mine") { UI.newsMine = e.target.checked; render(); } });
document.addEventListener("change", e => {
  if (e.target.id !== "imp-file" || !e.target.files[0]) return;
  const f = e.target.files[0], rd = new FileReader();
  rd.onload = () => {
    let s = null; try { s = JSON.parse(rd.result); } catch (err) { }
    if (!s || !s.v || s.myClub == null || !s.S || !DB.clubs[s.myClub]) { UI.modal = { title: "No se pudo importar", text: "El archivo no es una partida de Handball DT.", ok: "Entendido", run: () => render() }; render(); return; }
    const free = [1, 2, 3].find(n => !load(n)), n = free || UI.newSlot || SLOT;
    const go = () => { try { localStorage.setItem(slotKey(n), JSON.stringify(s)); } catch (err) { } SLOT = n; G = migrate(s); if (G.pending) resolvePending(); UI.newSlot = null; UI.view = G.fired ? "office" : G.ended ? "end" : "home"; save(); render(); scrollTop(); };
    if (free) go(); else { UI.modal = { title: "No hay ranuras libres", text: `Se va a reemplazar la partida de la ranura ${n}.`, ok: "Reemplazar", run: go }; render(); }
  };
  rd.readAsText(f); e.target.value = "";
});
let MKQ_T = null;
document.addEventListener("input", e => { if (e.target.id === "mk-q") { clearTimeout(MKQ_T); const v = e.target.value; MKQ_T = setTimeout(() => { UI.mk.q = v; UI.mk.page = 0; render(); const i = document.getElementById("mk-q"); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 350); } });
document.addEventListener("input", e => { if (e.target.id === "ed-name" && UI.ed) UI.ed.play.name = e.target.value; });
// arrastre en la pizarra de jugadas
let EDRAG = null;
document.addEventListener("pointerdown", e => { if (!UI.ed || UI.view !== "plays" || UI.ed.passMode) return; const el = e.target.closest("[data-edtok]"); if (!el) return; EDRAG = { el, pos: el.dataset.edtok, x: e.clientX, y: e.clientY, on: false }; });
document.addEventListener("pointermove", e => {
  if (!EDRAG) return; if (!EDRAG.on && Math.hypot(e.clientX - EDRAG.x, e.clientY - EDRAG.y) < 5) return;
  EDRAG.on = true; e.preventDefault();
  const r = document.querySelector(".ed-court").getBoundingClientRect(), fx = Math.max(0.01, Math.min(0.99, (e.clientX - r.left) / r.width)), fy = Math.max(0.01, Math.min(0.99, (e.clientY - r.top) / r.height));
  EDRAG.el.style.left = fx * 100 + "%"; EDRAG.el.style.top = fy * 100 + "%"; EDRAG.f = [fx, fy];
}, { passive: false });
document.addEventListener("pointerup", () => {
  if (!EDRAG) return; const D = EDRAG; EDRAG = null; if (!D.on || !D.f) return;
  SUPPRESS_CLICK = true; setTimeout(() => SUPPRESS_CLICK = false, 50);
  const E = UI.ed, ym = +(D.f[0] * 20).toFixed(2), xm = +Math.max(20.5, Math.min(39.6, 40 - D.f[1] * 20)).toFixed(2), pt = [xm, Math.max(0.3, Math.min(19.7, ym))];
  if (E.step === 0) { E.play.start = { ...(E.play.start || {}), [D.pos]: pt }; }
  else { const st = E.play.steps[E.step - 1]; st.mv = { ...(st.mv || {}), [D.pos]: pt }; }
  render();
});
// al volver a "En vivo" se dibuja el estado actual
const _render = render;
render = function () { _render(); if (G && UI.view === "live" && UI.live) startLive(); };

// ---------- arranque ----------
buildRosters(DB);
(function () { const s = load(); if (s && s.v) { G = migrate(s); if (G.pending) resolvePending(); UI.view = G.ended ? "end" : "home"; save(); } render(); })();
